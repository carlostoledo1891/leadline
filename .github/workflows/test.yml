name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:                                   # 3.7 to 3.9 are no longer built for ubuntu-latest (26.04): run them on 22.04
          - {os: ubuntu-22.04, python: '3.7'}
          - {os: ubuntu-22.04, python: '3.8'}
          - {os: ubuntu-22.04, python: '3.9'}
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: the examples' public data (fetched at their pins, never committed)
        uses: actions/cache@v4
        with:
          path: examples/data/cache
          key: data-${{ hashFiles('examples/data/fetch.py') }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
